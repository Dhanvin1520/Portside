name: Portside CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Type Check & Build
        run: npm run build

      - name: Unit Tests
        run: npm run test:unit

      - name: Property-Based Verification (fast-check)
        run: npm run test:property

      - name: Chaos Verification
        run: npm run chaos
